<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>FAR.E. Group</title>
<!-- Fallback shell: la root e' redirettata server-side a /it/ da staticwebapp.config.json
     (route "/" -> 302 /it/). Questa pagina viene servita solo se la config SWA
     non e' applicata (es. anteprima locale). Comportamento allineato al redirect server. -->
<script>window.location.replace('/it/');</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=/it/">
</noscript>
</head>
<body>
  <p>Reindirizzamento in corso... / Redirecting...</p>
  <p><a href="/it/">Italiano</a> | <a href="/en/">English</a></p>
</body>
</html>
